[workspace]
resolver = "3"
members = [
    "crates/momentum-core",
    "crates/momentum-api",
    "bin/hello-rest",
    "bin/hello-s3",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# REST
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }

# S3
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.55", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.7"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time / calendar
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"

# Decompression
flate2 = "1.0"

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace-internal
momentum-core = { path = "crates/momentum-core" }
momentum-api  = { path = "crates/momentum-api" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
