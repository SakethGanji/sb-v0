[workspace]
resolver = "3"
members = [
    "crates/momentum-core",
    "crates/momentum-api",
    "crates/momentum-store",
    "crates/momentum-calendar",
    "crates/momentum-classify",
    "crates/momentum-engine",
    "bin/hello-rest",
    "bin/hello-s3",
    "bin/smoke-universe",
    "bin/smoke-day",
    "bin/build-universe",
    "bin/bulk-download",
    "bin/build-splits",
    "bin/build-dividends",
    "bin/build-ticker-events",
    "bin/build-figi-map",
    "bin/convert-staging",
    "bin/verify-pivot",
    "bin/audit-bars",
    "bin/smoke-calendar",
    "bin/pull-fred-vix",
    "bin/build-ticker-details",
    "bin/build-short-interest",
    "bin/build-financials",
    "bin/build-edgar-acceptance",
    "bin/write-phase0",
    "bin/write-forward-outcomes",
    "bin/build-earnings-calendar",
    "bin/build-regimes",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# REST
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }

# S3
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.55", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.7"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time / calendar
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"

# Decompression
flate2 = "1.0"

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Arrow / Parquet — version pinned to match duckdb's bundled arrow so RecordBatch
# streams from `duckdb::query_arrow()` are zero-conversion handed to ArrowWriter.
arrow = { version = "58", default-features = false, features = ["chrono-tz", "csv"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd", "snap"] }

# Embedded analytical DB (used for the M3 bulk pivot and the BarReader UNION view).
duckdb = { version = "1.4", features = ["bundled"] }

# Random (jitter for retry backoff). Pull in once at the workspace level.
fastrand = "2"

# Resume cursor for the bulk ingest. `bundled` so we don't depend on system sqlite.
rusqlite = { version = "0.32", features = ["bundled"] }

# Test deps
wiremock = "0.6"

# Workspace-internal
momentum-core     = { path = "crates/momentum-core" }
momentum-api      = { path = "crates/momentum-api" }
momentum-store    = { path = "crates/momentum-store" }
momentum-calendar = { path = "crates/momentum-calendar" }
momentum-classify = { path = "crates/momentum-classify" }
momentum-engine   = { path = "crates/momentum-engine" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
